# Butterfly 主題設定（覆蓋主題預設值，只需列出要修改的項目）
# 完整選項請參考 Butterfly 官方文件

menu:
  首頁: / || fas fa-home
  存檔: /archives/ || fas fa-archive
  標籤: /tags/ || fas fa-tags
  分類: /categories/ || fas fa-folder-open
  關於: /about/ || fas fa-heart

# 預設深色模式
display_mode: dark

darkmode:
  enable: true
  button: true
  autoChangeMode: false
# PJAX 跨頁切換
pjax:
  enable: true

search:
  use: local_search

wordcount:
  enable: true
  post_wordcount: true
  min2read: true
  total_wordcount: true

# 護眼配色：鼠尾草綠 + 暖棕
theme_color:
  enable: true
  main: "#6B8E5A"
  paginator: "#8B6F47"
  button_hover: "#B07D4F"
  text_selection: "#A8C686"
  link_color: "#3F6B3A"
  meta_color: "#8A8578"
  hr_color: "#C9D6B5"
  code_foreground: "#A0522D"
  code_background: "rgba(139, 111, 71, .08)"
  toc_color: "#6B8E5A"
  blockquote_padding_color: "#8FAE7A"
  blockquote_background_color: "#8FAE7A"

# 整體背景改成偏暖的米色，比純白柔和
background: "#8B6B4E"

inject:
  head:
    # ==========================================
    # 深色護眼主題：橄欖綠 + 暖棕
    # ==========================================
    - |
      <meta name="theme-color" content="#222D22">
      <style>
      :root,
      :root[data-theme='dark'],
      :root:not([data-theme='dark']) {
        color-scheme: dark;

        /* 基礎配色 */
        --card-bg: #302D1D;
        --font-color: #E8E3D5;
        --text-highlight-color: #F5EBD6;
        --card-meta: #C5C9B6;

        /* 背景與按鈕 */
        --global-bg: #8B6B4E;
        --btn-bg: #657F55;
        --btn-hover-color: #E8E3D5;

        /* 引用區塊 */
        --blockquote-color: #B8D5A8;
        --blockquote-bg: #41412A;

        /* 分隔線 */
        --hr-border: #657A55;
        --hr-before-color: #D6E3C6;

        /* 側邊欄 */
        --text-bg-hover: #41412A;
        --sidebar-bg: #302D1D;
        --sidebar-menu-bg: #41412A;
        --sidebar-menu-color: #E8E3D5;
      }

      /* 網站背景 */
      body {
        background: #8B6B4E !important;
      }

      /* 文章及側邊欄卡片 */
      #aside-content .card-widget,
      #recent-posts > .recent-post-item,
      #post,
      #page,
      #archive,
      #tag,
      #category {
        background: #302D1D !important;
        color: #E8E3D5 !important;
      }

      /* 頂部導航 */
      #page-header.nav-fixed #nav {
        background: #222D22 !important;
      }

      /* 文章引用區塊 */
      #article-container blockquote {
        background: #41412A !important;
        border-left: 6px solid #8FAE7A !important;
        color: #B8D5A8 !important;
      }

      #article-container blockquote p {
        color: #B8D5A8 !important;
      }

      /* 右側功能按鈕 */
      #rightside > div > button,
      #rightside > div > a {
        background: #657F55 !important;
        color: #E8E3D5 !important;
      }
      </style>

    # ==========================================
    # APlayer 音樂播放器樣式
    # ==========================================

    # APlayer 官方 CSS
    - '<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aplayer@1.10.1/dist/APlayer.min.css">'

    # 自訂深色音樂播放器
    - '<link rel="stylesheet" href="/css/music.css">'

  bottom:
    # ==========================================
    # APlayer + Cloudflare R2 音樂列表
    # ==========================================

    # APlayer 核心
    - '<script src="https://cdn.jsdelivr.net/npm/aplayer@1.10.1/dist/APlayer.min.js"></script>'

    # 自訂 R2 音樂播放列表
    - '<script src="/js/music.js"></script>'


avatar:
  img: /img/avatar.png
  effect: false

favicon: /img/favicon.ico


# 文章目錄
toc:
  post: true
  page: false
  number: true
  expand: false
  style_simple: false
  scroll_percent: true

# 右下角返回頂部顯示閱讀進度
rightside_scroll_percent: true

# 文章過期提醒
noticeOutdate:
  enable: true
  style: flat
  limit_day: 365
  position: top
  message_prev: 本文距離上次更新已超過
  message_next: 天，部分內容可能已發生變化。

# 相關文章推薦
related_post:
  enable: true
  limit: 4
  date_type: created

# 文章版權
post_copyright:
  enable: true
  decode: false
  license: CC BY-NC-SA 4.0
  license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/

# 複製功能
copy:
  enable: true
  copyright:
    enable: false

# 閱讀體驗
beautify:
  enable: true
  field: post

# 簡潔外觀
rounded_corners_ui: true
preloader:
  enable: false

# 減少不必要的動畫
enter_transitions: false

# 本地搜尋補充設定
# 已有 search 配置，請合併到原區塊
# local_search:
#   preload: false
#   top_n_per_article: 2
#   unescape: false


comments:
  use: Giscus
  text: true
  lazyload: false
  count: false
  card_post_count: false

giscus:
  repo: ovraxel/ovraxel.github.io
  repo_id: R_kgDOVN9eKw
  category_id: DIC_kwDOVN9eK84DJG-I
  light_theme: light
  dark_theme: dark
  js:
  option: