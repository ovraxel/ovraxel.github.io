# Butterfly 主題設定（覆蓋主題預設值，只需列出要修改的項目）
# 完整選項請參考 Butterfly 官方文件

menu:
  首頁: / || fas fa-home
  存檔: /archives/ || fas fa-archive
  標籤: /tags/ || fas fa-tags
  分類: /categories/ || fas fa-folder-open
  關於: /about/ || fas fa-heart

darkmode:
  enable: true
  button: true
  autoChangeMode: false

search:
  use: local_search

wordcount:
  enable: true
  post_wordcount: true
  min2read: true
  total_wordcount: true

# 護眼配色：鼠尾草綠 + 暖棕
theme_color:
  enable: true
  main: "#6B8E5A"
  paginator: "#8B6F47"
  button_hover: "#B07D4F"
  text_selection: "#A8C686"
  link_color: "#3F6B3A"
  meta_color: "#8A8578"
  hr_color: "#C9D6B5"
  code_foreground: "#A0522D"
  code_background: "rgba(139, 111, 71, .08)"
  toc_color: "#6B8E5A"
  blockquote_padding_color: "#8FAE7A"
  blockquote_background_color: "#8FAE7A"

# 整體背景改成偏暖的米色，比純白柔和
background: "#8B6B4E"

inject:
  head:
    - '<style>:root:not([data-theme=dark]){--card-bg:#EFE6CC;--font-color:#3B352B;--text-highlight-color:#2B2418;--card-meta:#6B6252;--text-bg-hover:#E3D8B8;--hl-color:#3B352B;--hl-bg:#F4EBD3;--hltools-bg:#E3D8B8;--hltools-color:#6B5A3C;--hlnumber-bg:#F4EBD3;--hlnumber-color:#A08F6A;--sidebar-bg:#E3D8B8;--sidebar-menu-bg:#EFE6CC;--sidebar-menu-color:#3B352B;}:root:not([data-theme=dark]) #sidebar #sidebar-menus{background:#E3D8B8;}:root:not([data-theme=dark]) #sidebar .menus_items{background:#EFE6CC;border-color:#D6C9A3;}</style>'

avatar:
  img: /img/avatar.png
  effect: false

favicon: /img/favicon.ico


# 文章目錄
toc:
  post: true
  page: false
  number: true
  expand: false
  style_simple: false
  scroll_percent: true

# 右下角返回頂部顯示閱讀進度
rightside_scroll_percent: true

# 文章過期提醒
noticeOutdate:
  enable: true
  style: flat
  limit_day: 365
  position: top
  message_prev: 本文距離上次更新已超過
  message_next: 天，部分內容可能已發生變化。

# 相關文章推薦
related_post:
  enable: true
  limit: 4
  date_type: created

# 文章版權
post_copyright:
  enable: true
  decode: false
  license: CC BY-NC-SA 4.0
  license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/

# 複製功能
copy:
  enable: true
  copyright:
    enable: false

# 閱讀體驗
beautify:
  enable: true
  field: post

# 簡潔外觀
rounded_corners_ui: true
preloader:
  enable: false

# 減少不必要的動畫
enter_transitions: false

# 本地搜尋補充設定
# 已有 search 配置，請合併到原區塊
# local_search:
#   preload: false
#   top_n_per_article: 2
#   unescape: false
