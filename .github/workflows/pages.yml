name: Hexo Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('**/package.json', '**/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Verify Hexo project
        run: |
          test -f package.json || { echo "::error::package.json not found"; ls -la; exit 1; }
          test -f _config.yml || { echo "::error::_config.yml not found"; ls -la; exit 1; }
          node -e '
            const p = require("./package.json");
            const deps = { ...p.dependencies, ...p.devDependencies };
            if (!deps.hexo) { console.error("::error::hexo is missing from dependencies"); process.exit(1); }
            if (!p.hexo) { console.error("::error::package.json has no hexo field"); process.exit(1); }
          '

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Generate Hexo
        run: |
          npx --no-install hexo version
          npx --no-install hexo clean
          npx --no-install hexo generate
          test -f public/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
